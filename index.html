<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Genesis 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(100, 180, 255, 0.35), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(150, 220, 255, 0.35), transparent 30%),
        linear-gradient(135deg, #f8fdff, #e5f4ff);
      color: #17365d;
      position: relative;
    }

    /* Soft background glow */
    .background-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.8), transparent 40%);
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 10;

      width: min(520px, calc(100% - 40px));

      margin: 0 auto;
      top: 50vh;
      transform: translateY(-50%);

      padding: 45px 35px;

      text-align: center;

      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 30px;

      box-shadow:
        0 25px 70px rgba(30,100,160,0.18),
        inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .eyebrow {
      margin: 0 0 10px;

      font-size: 11px;
      font-weight: bold;

      letter-spacing: 4px;
      text-transform: uppercase;

      color: #4b86bd;
    }

    h1 {
      margin: 0;

      font-size: clamp(36px, 7vw, 55px);
      line-height: 1.05;

      color: #2468d8;
    }

    .subtitle {
      margin: 18px auto 28px;

      max-width: 400px;

      font-size: 16px;
      line-height: 1.6;

      color: #58708c;
    }

    /* Button */
    button {
      border: none;

      padding: 15px 32px;

      border-radius: 14px;

      font-size: 16px;
      font-weight: bold;

      color: white;

      cursor: pointer;

      background: linear-gradient(
        135deg,
        #3787ff,
        #1759cf
      );

      box-shadow:
        0 12px 28px rgba(40,110,220,0.3),
        inset 0 1px 0 rgba(255,255,255,0.4);

      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);

      box-shadow:
        0 18px 35px rgba(40,110,220,0.4),
        0 0 25px rgba(70,160,255,0.3);
    }

    button:active {
      transform: scale(0.97);
    }

    /* Message */
    #message {
      margin-top: 20px;

      min-height: 25px;

      font-size: 17px;
      font-weight: bold;

      color: #159447;

      opacity: 0;
      transform: translateY(8px);

      transition: 0.4s ease;
    }

    #message.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Garden */
    .garden {
      position: fixed;
      inset: 0;

      z-index: 2;

      pointer-events: none;
    }

    /* Flower */
    .flower {
      position: absolute;

      width: 100px;
      height: 180px;

      transform-origin: bottom center;

      animation: sway 5s ease-in-out infinite;
    }

    .stem {
      position: absolute;

      left: 47px;
      bottom: 0;

      width: 7px;
      height: 125px;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #318667,
          #73c6a0,
          #267558
        );
    }

    /* Leaves */
    .leaf {
      position: absolute;

      width: 45px;
      height: 20px;

      border-radius: 100% 0 100% 0;

      background:
        linear-gradient(
          135deg,
          #68c29f,
          #267d61
        );
    }

    .leaf.left {
      left: 5px;
      bottom: 50px;

      transform: rotate(25deg);
    }

    .leaf.right {
      left: 47px;
      bottom: 72px;

      transform:
        scaleX(-1)
        rotate(25deg);
    }

    /* Flower head */
    .bloom {
      position: absolute;

      left: 50%;
      top: 5px;

      width: 85px;
      height: 85px;

      transform: translateX(-50%);
    }

    /* Petals */
    .petal {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 32px;
      height: 46px;

      border-radius: 60% 60% 45% 45%;

      transform:
        translate(-50%, -90%)
        rotate(var(--rotation))
        translateY(-20px);

      background:
        radial-gradient(
          circle at 40% 20%,
          white 0 8%,
          #a7dcff 25%,
          #4b9be9 65%,
          #2264c5 100%
        );

      box-shadow:
        inset 2px 3px 8px rgba(255,255,255,0.6),
        0 5px 12px rgba(40,100,180,0.18);
    }

    /* Flower center */
    .center {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 25px;
      height: 25px;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #fff9bd 0 20%,
          #f5d54c 21% 55%,
          #d5a52c 56%
        );

      box-shadow: 0 3px 8px rgba(150,110,20,0.25);
    }

    /* Flower positions */
    .flower1 {
      left: -10px;
      bottom: -15px;

      transform: scale(1.2);

      animation-delay: -1s;
    }

    .flower2 {
      left: 7%;
      top: 5%;

      transform: scale(0.75);

      animation-delay: -2s;
    }

    .flower3 {
      right: 5%;
      top: 10%;

      transform: scale(0.8);

      animation-delay: -1.5s;
    }

    .flower4 {
      right: -10px;
      bottom: -10px;

      transform: scale(1.05);

      animation-delay: -3s;
    }

    .flower5 {
      left: 22%;
      bottom: -25px;

      transform: scale(0.6);

      animation-delay: -2.5s;
    }

    .flower6 {
      right: 22%;
      bottom: -20px;

      transform: scale(0.65);

      animation-delay: -1.8s;
    }

    /* Breeze */
    @keyframes sway {

      0%,
      100% {
        rotate: -5deg;
      }

      50% {
        rotate: 5deg;
      }
    }

    /* Floating petals */
    .floating-petal {
      position: fixed;

      width: 12px;
      height: 19px;

      border-radius: 70% 30% 70% 30%;

      background:
        linear-gradient(
          135deg,
          #c3e8ff,
          #428fdd
        );

      opacity: 0.7;

      pointer-events: none;

      animation: floatPetal 6s linear forwards;
    }

    @keyframes floatPetal {

      0% {
        transform:
          translateY(-20px)
          rotate(0deg);

        opacity: 0;
      }

      10% {
        opacity: 0.8;
      }

      50% {
        transform:
          translate(60px, 50vh)
          rotate(180deg);
      }

      100% {
        transform:
          translate(-40px, 110vh)
          rotate(360deg);

        opacity: 0;
      }
    }

    /* Mobile */
    @media (max-width: 650px) {

      .card {
        padding: 38px 24px;
      }

      .flower2,
      .flower3 {
        opacity: 0.3;
      }

      .flower1 {
        left: -45px;
      }

      .flower4 {
        right: -45px;
      }
    }
  </style>
</head>

<body>

  <div class="background-glow"></div>

  <!-- BLUE FLOWER GARDEN -->
  <div class="garden">

    <!-- Flower 1 -->
    <div class="flower flower1">
      <div class="stem"></div>
      <div class="leaf left"></div>
      <div class="leaf right"></div>

      <div class="bloom">
        <i class="petal" style="--rotation:0deg"></i>
        <i class="petal" style="--rotation:60deg"></i>
        <i class="petal" style="--rotation:120deg"></i>
        <i class="petal" style="--rotation:180deg"></i>
        <i class="petal" style="--rotation:240deg"></i>
        <i class="petal" style="--rotation:300deg"></i>

        <i class="center"></i>
      </div>
    </div>

    <!-- Flower 2 -->
    <div class="flower flower2">
      <div class="stem"></div>
      <div class="leaf left"></div>
      <div class="leaf right"></div>

      <div class="bloom">
        <i class="petal" style="--rotation:0deg"></i>
        <i class="petal" style="--rotation:72deg"></i>
        <i class="petal" style="--rotation:144deg"></i>
        <i class="petal" style="--rotation:216deg"></i>
        <i class="petal" style="--rotation:288deg"></i>

        <i class="center"></i>
      </div>
    </div>

    <!-- Flower 3 -->
    <div class="flower flower3">
      <div class="stem"></div>
      <div class="leaf left"></div>
      <div class="leaf right"></div>

      <div class="bloom">
        <i class="petal" style="--rotation:0deg"></i>
        <i class="petal" style="--rotation:60deg"></i>
        <i class="petal" style="--rotation:120deg"></i>
        <i class="petal" style="--rotation:180deg"></i>
        <i class="petal" style="--rotation:240deg"></i>
        <i class="petal" style="--rotation:300deg"></i>

        <i class="center"></i>
      </div>
    </div>

    <!-- Flower 4 -->
    <div class="flower flower4">
      <div class="stem"></div>
      <div class="leaf left"></div>
      <div class="leaf right"></div>

      <div class="bloom">
        <i class="petal" style="--rotation:0deg"></i>
        <i class="petal" style="--rotation:60deg"></i>
        <i class="petal" style="--rotation:120deg"></i>
        <i class="petal" style="--rotation:180deg"></i>
        <i class="petal" style="--rotation:240deg"></i>
        <i class="petal" style="--rotation:300deg"></i>

        <i class="center"></i>
      </div>
    </div>

    <!-- Flower 5 -->
    <div class="flower flower5">
      <div class="stem"></div>
      <div class="leaf left"></div>
      <div class="leaf right"></div>

      <div class="bloom">
        <i class="petal" style="--rotation:0deg"></i>
        <i class="petal" style="--rotation:90deg"></i>
        <i class="petal" style="--rotation:180deg"></i>
        <i class="petal" style="--rotation:270deg"></i>

        <i class="center"></i>
      </div>
    </div>

    <!-- Flower 6 -->
    <div class="flower flower6">
      <div class="stem"></div>
      <div class="leaf left"></div>
      <div class="leaf right"></div>

      <div class="bloom">
        <i class="petal" style="--rotation:0deg"></i>
        <i class="petal" style="--rotation:72deg"></i>
        <i class="petal" style="--rotation:144deg"></i>
        <i class="petal" style="--rotation:216deg"></i>
        <i class="petal" style="--rotation:288deg"></i>

        <i class="center"></i>
      </div>
    </div>

  </div>

  <!-- Floating petals appear after clicking -->
  <div id="petals"></div>

  <!-- MAIN CONTENT -->
  <main class="card">

    <p class="eyebrow">
      A Little Garden of Blue
    </p>

    <h1>
      Hello Genesis 2026!
    </h1>

    <p class="subtitle">
      This is our team's first live page.
      Welcome to our little digital garden.
    </p>

    <button id="clickMe">
      Click Me
    </button>

    <div id="message">
      It works! 🎉
    </div>

  </main>

  <script>

    const button = document.getElementById("clickMe");
    const message = document.getElementById("message");
    const petalsContainer = document.getElementById("petals");

    button.addEventListener("click", function () {

      /* Keep the original functionality */
      message.classList.add("show");

      /* Create lots of blue petals */
      for (let i = 0; i < 30; i++) {

        const petal = document.createElement("span");

        petal.className = "floating-petal";

        petal.style.left =
          Math.random() * 100 + "%";

        petal.style.animationDuration =
          (4 + Math.random() * 5) + "s";

        petal.style.animationDelay =
          Math.random() * 1.5 + "s";

        petal.style.transform =
          `scale(${0.5 + Math.random()})`;

        petalsContainer.appendChild(petal);

        /* Remove old petals */
        setTimeout(() => {
          petal.remove();
        }, 10000);

      }

    });

  </script>

</body>
</html>
